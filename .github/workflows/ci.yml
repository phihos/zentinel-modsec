name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --package zentinel-modsec --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-clippy-
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo clippy --locked --features libinjection-ffi --all-targets -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-test-
      # The CRS corpus is a separate job: it needs a checkout of the rule set
      # and is worth running optimised. Skipping it here keeps this job fast
      # rather than leaving it unrun — see the `conformance` job below.
      - run: cargo test --locked --all-targets
        env:
          SKIP_CRS_CONFORMANCE: 1
      - run: cargo test --locked --features libinjection-ffi --all-targets
        env:
          SKIP_CRS_CONFORMANCE: 1
      - run: cargo test --locked --doc

  conformance:
    name: OWASP CRS conformance (${{ matrix.backend }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: rust-libinjection
            features: ""
          - backend: libinjection-ffi
            features: libinjection-ffi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-conformance-${{ matrix.backend }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-conformance-${{ matrix.backend }}-
      # Stage identities and both backend outcomes are tied to this revision.
      - name: Fetch OWASP CRS
        env:
          CRS_COMMIT: 30cb436b261a9f5ec32a5a0677e17f3cfa1a8739
        run: |
          mkdir -p test-rules/crs
          git -C test-rules/crs init -q
          git -C test-rules/crs fetch -q --depth 1 https://github.com/coreruleset/coreruleset.git "$CRS_COMMIT"
          git -C test-rules/crs checkout -q FETCH_HEAD
          cp test-rules/crs/crs-setup.conf.example test-rules/crs/crs-setup.conf
          git -C test-rules/crs log -1 --format='CRS %h %ci'
      # Release: ~14s against the corpus, versus minutes unoptimised. This job
      # must not set SKIP_CRS_CONFORMANCE — that is what makes the gate real.
      - run: cargo test --locked --release --features "$CRS_FEATURES" --test crs_conformance -- --nocapture
        env:
          CRS_FEATURES: ${{ matrix.features }}
